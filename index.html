<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081526"><title>蜘蛛侠 · 3D 自由之城</title><meta name="description" content="在 3D 城市自由发射双手蛛丝、飞跃高楼，转动镜头探索并挑战三个 Boss。"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css?v=3d"></head><body>
<canvas id="game" aria-label="蜘蛛侠 3D 城市游戏"></canvas><div class="vignette"></div>
<header><div class="brand"><div class="emblem">✦</div><div><strong>蜘蛛侠 <span>自由之城</span></strong><small>3D / 自由探索</small></div></div><div class="top-actions"><button id="help" aria-label="操作说明">?</button><button id="pause" aria-label="暂停">Ⅱ</button></div></header>
<div class="status"><span>生命</span><div class="health-track"><i id="health"></i></div><b id="hp">100</b></div><div class="location"><span id="location">河岸楼顶</span><small id="count">Boss 0 / 3</small></div>
<div id="bossHUD" hidden><b id="bossName"></b><div class="boss-track"><i id="bossHealth"></i></div><small id="warning"></small></div>
<div class="radar"><canvas id="radar" width="150" height="150" aria-label="城市小地图"></canvas><button id="mapButton">城市地图</button></div>
<div id="speed"><b>0</b><span>飞行速度</span></div><div class="crosshair" aria-hidden="true"></div><div id="anchorLeft" class="anchor left" hidden><span>左手</span></div><div id="anchorRight" class="anchor right" hidden><span>右手</span></div>
<div id="toast" role="status"></div><div id="lookHint">滑动画面转镜头</div>
<div class="controls"><div class="stick-area"><div id="stick" aria-label="移动摇杆"><div class="stick-ring"></div><div id="knob"></div></div><span>移动</span></div><div class="actions"><button data-action="jump" class="jump">跳跃<small>SPACE</small></button><button data-action="attack" class="attack">蛛丝攻击<small>F</small></button><button data-action="webLeft" class="web">左手蛛丝<small>Q · 按住</small></button><button data-action="webRight" class="web">右手蛛丝<small>E · 按住</small></button></div></div>
<div id="overlay" class="overlay"><section class="panel"><div class="eyebrow">3D OPEN CITY</div><h1>抬头看，<br><em>整座城市都是路。</em></h1><p>用双手蛛丝飞过高楼，转动镜头自由探索。<br>犀牛人、电光人、绿魔等着你，随时都能挑战。</p><div class="guide"><div><b>01</b><span>移动 + 跳跃<small>手机用左摇杆，电脑用 W A S D</small></span></div><div><b>02</b><span>按住蛛丝，松手飞出去<small>自动挂住前方楼顶，两只手都可以用</small></span></div><div><b>03</b><span>转动镜头，寻找 Boss<small>滑动画面 / 鼠标拖动，靠近后按攻击</small></span></div></div><button id="start" class="primary">进入 3D 城市</button><small class="hint">电脑：空格跳跃 · Q / E 蛛丝 · F 攻击 · Esc 暂停<br>手机横屏可以看得更远</small><p id="error" hidden></p></section></div>
<div id="mapOverlay" class="overlay" hidden><section class="panel map-panel"><div class="eyebrow">CITY MAP</div><h2>下一站，去哪里？</h2><canvas id="cityMap" width="420" height="260" aria-label="城区与 Boss 位置"></canvas><div id="mapPlaces"></div><button id="closeMap" class="primary">继续飞行</button></section></div>
<script type="module" src="game3d.js"></script></body></html>
